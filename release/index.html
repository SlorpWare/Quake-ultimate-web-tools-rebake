function captureConsole(type, args)
{
	const output = document.getElementById("debug-console-output");
	const line = document.createElement("div");
	line.className = type;
	line.textContent = `[${type}] ` + Array.from(args, value => {
		if (value instanceof Error)
			return value.stack || `${value.name}: ${value.message}`;
		if (typeof value === "string")
			return value;
		try { return JSON.stringify(value); }
		catch (_) { return String(value); }
	}).join(" ");
	output.appendChild(line);
	while (output.childElementCount > 300)
		output.firstElementChild.remove();
	output.scrollTop = output.scrollHeight;
}

for (const type of ["log", "info", "warn", "error", "debug", "trace", "dir", "table"])
{
	const original = console[type].bind(console);
	console[type] = (...args) => {
		captureConsole(type, args);
		original(...args);
	};
}
window.addEventListener("error", event => captureConsole("error", [event.message, event.filename, `${event.lineno}:${event.colno}`]));
window.addEventListener("unhandledrejection", event => captureConsole("error", ["Unhandled promise rejection:", event.reason]));
document.getElementById("debug-console-clear").addEventListener("click", () => document.getElementById("debug-console-output").replaceChildren());

const debugConsole = document.getElementById("debug-console");
const debugConsoleBar = document.getElementById("debug-console-bar");
let debugDragOffset;
debugConsoleBar.addEventListener("pointerdown", event => {
	if (event.target.closest("button")) return;
	const rect = debugConsole.getBoundingClientRect();
	debugDragOffset = { x: event.clientX - rect.left, y: event.clientY - rect.top };
	debugConsole.style.left = `${rect.left}px`;
	debugConsole.style.top = `${rect.top}px`;
	debugConsole.style.right = "auto";
	debugConsoleBar.setPointerCapture(event.pointerId);
});
debugConsoleBar.addEventListener("pointermove", event => {
	if (!debugConsoleBar.hasPointerCapture(event.pointerId)) return;
	debugConsole.style.left = `${Math.max(0, Math.min(innerWidth - debugConsole.offsetWidth, event.clientX - debugDragOffset.x))}px`;
	debugConsole.style.top = `${Math.max(0, Math.min(innerHeight - 32, event.clientY - debugDragOffset.y))}px`;
});
debugConsoleBar.addEventListener("pointerup", event => {
	if (debugConsoleBar.hasPointerCapture(event.pointerId)) debugConsoleBar.releasePointerCapture(event.pointerId);
});

function str2ab(str)
{   //helper function. Not utf-8, so stick to ascii chars
    var buf = new ArrayBuffer(str.length);
    var bufView = new Uint8Array(buf);
    for (var i=0, strLen=str.length; i < strLen; i++)
        bufView[i] = str.charCodeAt(i);
    return buf;
}

// Show transfer progress only if an upload/download lasts longer than 8 seconds.
let transferTask = null;
function startTransfer(label, totalBytes)
{
	finishTransfer();
	const task = {label, total: totalBytes || 0, done: 0, started: Date.now(), timer: null};
	transferTask = task;
	task.timer = setTimeout(() => {
		if (transferTask !== task) return;
		document.getElementById("transfer-progress").hidden = false;
		updateTransfer(task);
	}, 8000);
	return task;
}
function updateTransfer(task)
{
	if (transferTask !== task) return;
	const elapsed = (Date.now() - task.started) / 1000;
	const bar = document.getElementById("transfer-progress-bar");
	const rate = elapsed > 0 ? task.done / elapsed : 0;
	if (task.total > 0) {
		const pct = Math.min(100, task.done / task.total * 100);
		const remaining = rate > 0 ? Math.max(0, (task.total-task.done)/rate) : null;
		const eta = remaining === null ? "estimating..." : (remaining < 60 ? Math.ceil(remaining)+"s" : Math.floor(remaining/60)+"m "+Math.ceil(remaining%60)+"s");
		bar.max = 100;
		bar.value = pct;
		document.getElementById("transfer-progress-label").textContent = task.label+" — "+Math.floor(pct)+"% — ETA "+eta;
	} else {
		bar.removeAttribute("value");
		document.getElementById("transfer-progress-label").textContent = task.label+" — "+(task.done / (1024*1024)).toFixed(1)+" MB received — total size unavailable";
	}
}
function advanceTransfer(task, bytes) { task.done += bytes || 0; updateTransfer(task); }
function finishTransfer(task)
{
	if (task && transferTask !== task) return;
	if (transferTask && transferTask.timer) clearTimeout(transferTask.timer);
	transferTask = null;
	const panel = document.getElementById("transfer-progress");
	if (panel) panel.hidden = true;
}
function splitFTEArguments(value)
{
	const result = [];
	const re = /"([^"]*)"|'([^']*)'|(\S+)/g;
	let match;
	while ((match = re.exec(value || "")) !== null)
		result.push(match[1] !== undefined ? match[1] : match[2] !== undefined ? match[2] : match[3]);
	return result;
}

}

//stuff to facilitate our drag+drop filesystem support
function fixupfilepath(fname, path)
{	//we just have a filename, try to guess where to put it.
	if (path != "")
		return path+fname;	//already has a path. use it. this allows people to drag+drop gamedirs.
	var ext = fname.substr(fname.lastIndexOf('.') + 1);
	if (ext == 'fmf' || ext == 'kpf')	//these are the only files that really make sense in the root.
		return fname;
	if (ext == 'bsp' || ext == 'map' || ext == 'lit' || ext == 'lux')
		return "id1/maps/" + fname;	//bsps get their own extra subdir
	return "id1/" + fname;	//probably a pak. maybe a cfg, no idea really.
}
function remfile(fname)
{
	delete Module.files[fname];
	showfiles();	//repaint
}
function renamefile(fname)
{
	const nname = prompt("Please enter new name", fname);
	if (nname != null)
	{
		Module.files[nname] = Module.files[fname];
		delete Module.files[fname];
		showfiles();
	}
}
function simfile(fname)
{
	const newpath = prompt("Please enter simulated directory path (e.g., 'id1/', 'mymod/', or leave empty for root)", "");
	if (newpath != null)
	{
		let newname = newpath;
		if (newpath != "" && !newpath.endsWith("/"))
			newname = newpath + "/";
		newname = newname + fname.split("/").pop();	//extract just the filename
		Module.files[newname] = Module.files[fname];
		delete Module.files[fname];
		showfiles();
	}
}
function remcfile(fname)
{
	Module['cache'].delete("/_/"+fname);
	Module['cache'].keys().then((keys)=>{Module['cachekeys'] = keys; showfiles();}); //repaint
}
function remlfile(fname)
{
	window.localStorage.removeItem(fname);
	showfiles(); //repaint
}
function savelfile(fname)
{
	window.showSaveFilePicker({id: "openfile", startIn: "documents", suggestedName: fname})
	.then(async (h)=>{
		let data = await window.localStorage.getitem(fname);
		let f = await h.createWriteable();
		await f.write(data);
		await f.close();
	});
}
function adduserfile()
{
	window.showOpenFilePicker(
		{   types:[
				{
					description: "Packages",
					accept:{"text/*":[".pk3", ".pak", ".pk4", ".zip"]}
				},
				{
					description: "Maps",
					accept:{"text/*":[".bsp.gz", ".bsp", ".map"]}
				},
				{
					description: "Demos",
					accept:{"application/*":[".mvd.gz", ".qwd.gz", ".dem.gz", ".mvd", ".qwd", ".dem"]}  //dm2?
				},
				{
					description: "FTE Manifest",
					accept:{"text/*":[".fmf"]}
				},
				//model formats?... nah, too many/weird. they can always
				//audio formats?    eww
				//image formats?    double eww!
				{
					description: "Configs",
					accept:{"text/*":[".cfg", ".rc"]}
				}],
			excludeAcceptAllOption:false,   //let em pick anything. we actually support more than listed here (and bitrot...)
			id:"openfile",  //remember the dir we were in for the next invocation
			multiple:true
		})
	.then(async (r)=>
		{
			let gamedir = prompt("Please enter gamedir", "id1");
			if (gamedir != "")
				gamedir = gamedir+"/";
			const pickedFiles = await Promise.all(r.map(handle => handle.getFile()));
			const totalBytes = pickedFiles.reduce((sum, file) => sum + file.size, 0);
			const task = startTransfer("Uploading files", totalBytes);
			try {
				for (const f of pickedFiles) {
					const n = fixupfilepath(f.name, gamedir);
					Module.files[n] = await f.arrayBuffer();
					advanceTransfer(task, f.size);
				}
			} finally {
				finishTransfer(task);
				showfiles();
			}
		}).catch((e)=>{console.log("showOpenFilePicker() aborted", e);});
}

document.getElementById("directory-input").addEventListener("change", async function(event)
{
	const files = Array.from(event.target.files || []);
	event.target.value = "";
	if (!files.length) return;
	const totalBytes = files.reduce((sum, file) => sum + file.size, 0);
	if (totalBytes > 2 * 1024 * 1024 * 1024)
		alert("Warning: this directory contains more than 2 GB of assets. Files are stored in browser memory and may crash the browser. Trim the mod before continuing.");
	const task = startTransfer("Uploading directory", totalBytes);
	try {
		for (const file of files) {
			Module.files[file.webkitRelativePath || file.name] = await file.arrayBuffer();
			advanceTransfer(task, file.size);
		}
	} catch (error) {
		console.error("Directory upload failed:", error);
		alert("Directory upload failed: " + error);
	} finally {
		finishTransfer(task);
		showfiles();
	}
});

function addurlfile()
{
	const url = prompt("Please enter the URL of the file to download:", "");
	if (url == null || url.trim() == "")
		return;	//user cancelled
	
	const filename = url.split('/').pop().split('?')[0] || "downloaded_file";
	let gamedir = prompt("Please enter gamedir (or leave empty for auto-detect)", "");
	if (gamedir != "")
		gamedir = gamedir+"/";
	
	const filepath = fixupfilepath(filename, gamedir);
	
	console.log("Downloading: " + url + " -> " + filepath);
	
	const task = startTransfer("Downloading " + filename, 0);
	fetch(url)
	.then(async response => {
		if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
		task.total = Number(response.headers.get("Content-Length")) || 0;
		if (!response.body) {
			const buffer = await response.arrayBuffer();
			advanceTransfer(task, buffer.byteLength);
			return buffer;
		}
		const reader = response.body.getReader();
		const chunks = [];
		let received = 0;
		while (true) {
			const part = await reader.read();
			if (part.done) break;
			chunks.push(part.value);
			received += part.value.byteLength;
			advanceTransfer(task, part.value.byteLength);
		}
		const joined = new Uint8Array(received);
		let offset = 0;
		for (const chunk of chunks) { joined.set(chunk, offset); offset += chunk.byteLength; }
		return joined.buffer;
	})
	.then(buffer => {
		Module.files[filepath] = buffer;
		console.log("Successfully downloaded: " + filepath + " (" + buffer.byteLength + " bytes)");
		showfiles();
	})
	.catch(error => {
		console.error("Failed to download file: " + error);
		alert("Failed to download file:\n" + error);
	})
	.finally(() => finishTransfer(task));
}
function showfiles()
{	//print the pending file list in some pretty way
	if (Module.began)
		return;
	Module.setStatus('');
	document.getElementById('dropzone').hidden = false;
	document.getElementById('begin').hidden = false;
	let nt = "<H1>FTE Engine (Browser Port)</H1>";
	nt = nt + "Drag gamedirs or individual package files here to make them available!<pre>";
	let keys = Object.keys(Module.files);
	nt += "Session Files ("+keys.length+"):<br/>";
	for(let i = 0; i < keys.length; i++)
	{
		let rem = 	" <a href=\"javascript:remfile('"+keys[i]+"');\">[forget]</a>" +
					" <a href=\"javascript:renamefile('"+keys[i]+"');\">[rename]</a>" +
					" <a href=\"javascript:simfile('"+keys[i]+"');\">[simulated directory]</a>";
		if (Module.files[keys[i]] instanceof ArrayBuffer)
		{
			let sz = Module.files[keys[i]].byteLength;
			if (sz > 512*1024)
				sz = (sz / (1024*1024)) + "mb";
			else if (sz > 512)
				sz = (sz / 1024) + "kb";
			else
				sz = (sz) + " bytes";
			nt += "    " + keys[i] + " ("+sz+")"+rem+"<br/>";
		}
		else
			nt += "    " + keys[i] + rem + "<br/>";
	}

	//cache is for large data files. for any pk3s the user might add in-engine. large stuff that's easy to fix if it gets wiped.
	const cache = Module['cache'];
	const ckeys = Module['cachekeys'];
	if (ckeys !== undefined && ckeys.length)
	{
		nt += "<br/>Cached Files ("+ckeys.length+"):<br/>";
		for(let r of ckeys)
		{
			const idx = r.url.indexOf("/_/")
			if (idx < 0)
				continue;   //wtf? that entry should not have been in this cache object.
			const fn = r.url.substr(idx+3);
			let rem = " <a href=\"javascript:remcfile('"+fn+"');\">[forget]</a>";
			nt += "    " + fn + rem + "<br/>";
		}
	}

	//local storage is used for slightly more persistent things, like user configs and saved games. we have quite limited storage, and this is basically text only.
	try
	{
		const ls = window.localStorage;
		if (ls && ls.length)
		{
			nt += "<br/>Local Files ("+ls.length+"):<br/>";
			for (let i = 0; i < ls.length; i++)
			{
				const fn = ls.key(i);
				const rem = " <a href=\"javascript:remlfile('"+fn+"');\">[forget]</a>" + (window.showSaveFilePicker!==undefined?" <a href=\"javascript:savelfile('"+fn+"');\">[export]</a>":"");
				nt += "    " + fn + rem + "<br/>";
			}
		}
	}
	catch(e){}

	nt += "</pre>";

	nt += "<p/>Cookie Disclaimer:<small> This page does not use cookies, however it does use local storage to save configs+games (consistent with natively installed games).<br/>frag-net (our matchmaking service) does not utilise any tracking beyond the session in question, but it does allow connecting to third-party servers which may incorporate ranking systems or accounts or other tracking according to that server's privacy/tracking policies.</small>"
	document.getElementById('dropzone').innerHTML = nt;
}
function scanfiles(item,path)
{	//for directory drops
	if (item.isFile)
	{
		if (path=="")
		{
			path = prompt("Please enter gamedir", "id1");
			if (path != "")
				path = path+"/";
		}
		item.file(function(f)
		{
			let n = fixupfilepath(f.name, path);
			Module.files[n]=f.arrayBuffer();	//actually a promise...
			Module.files[n].then(buf=>{Module.files[n]=buf;showfiles();});	//try and resolve it now.
    	});
	}
	else if (item.isDirectory)
	{
		// Get folder contents
		var dirReader = item.createReader();
		dirReader.readEntries(function(entries)
		{
			for (var i=0; i<entries.length; i++)
				scanfiles(entries[i], path + item.name + "/");
		});
	}
}
function gotdrop(ev)
{	//user drag+dropped something. 
	ev.preventDefault();
	for (var i = 0; i < ev.dataTransfer.items.length; i++)
		if (ev.dataTransfer.items[i].webkitGetAsEntry)
		{
			var d = ev.dataTransfer.items[i].webkitGetAsEntry();
			if (d)
				scanfiles(d, "");
		}
		else if (ev.dataTransfer.items[i].kind === 'file')
		{
			var f = ev.dataTransfer.items[i].getAsFile();
			var n = fixupfilepath(f.name, "");
			Module.files[n]=f.arrayBuffer();	//actually a promise...
			Module.files[n].then(buf=>{Module.files[n]=buf;showfiles();});	//try and resolve it now.
		}
	showfiles();
}
if (window.showOpenFilePicker)
	addfile.hidden = false;
addurl.hidden = false;
if (window.location.hash != "" || Module["autostart"])
	begin();		//if the url has a #foo.fmf then just begin instantly, 
else
{
	try {
		caches.open('user').then((c)=>{Module['cache']=c;return c.keys();}).then((keys)=>{Module['cachekeys'] = keys; showfiles();});
	} catch(e){
	} finally {
		showfiles();	//otherwise show our lame file dropper and wait for the user to click 'go'.
	}
}
    </script>
